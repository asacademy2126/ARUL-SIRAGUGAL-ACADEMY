<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.header{
background:#0d47a1;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:30px auto;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.15);
text-align:center;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
color:#0d47a1;
margin-bottom:10px;
}

.card p{
color:#555;
}
</style>

</head>

<body>

<div class="header">
🎓 Arul Siragugal Academy
</div>

<div class="container">

<div class="card">
<h2>👨‍🎓 Students</h2>
<p>Manage Students</p>
</div>

<div class="card">
<h2>📅 Attendance</h2>
<p>Daily Attendance</p>
</div>

<div class="card">
<h2>💰 Fees</h2>
<p>Fee Collection</p>
</div>

<div class="card">
<h2>📝 Exams</h2>
<p>Exam Marks</p>
</div>

<div class="card">
<h2>📚 Homework</h2>
<p>Study Materials</p>
</div>

<div class="card">
<h2>📊 Reports</h2>
<p>Monthly Reports</p>
</div>

</div>

</body>
</html>
